name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy --python-version "${{ matrix.python-version }}" src

      - name: Test with branch coverage
        run: pytest

      - name: End-to-end pretrain-transfer smoke
        run: |
          fmco collect \
            --families knapsack independent_set set_cover \
            --instances-per-family 2 --min-variables 5 --max-variables 6 \
            --seed 700 --output /tmp/seen-train
          fmco collect \
            --families knapsack independent_set set_cover \
            --instances-per-family 1 --min-variables 5 --max-variables 6 \
            --seed 800 --output /tmp/seen-validation
          fmco pretrain /tmp/seen-train \
            --epochs 1 --batch-size 2 --hidden-dim 12 --rounds 1 --seed 7 \
            --checkpoint /tmp/pretrained.safetensors
          fmco adapt /tmp/seen-train --validation /tmp/seen-validation \
            --tasks knapsack independent_set set_cover \
            --input-checkpoint /tmp/pretrained.safetensors \
            --epochs 2 --batch-size 2 --seed 8 \
            --checkpoint /tmp/multitask.safetensors
          fmco generate \
            --family knapsack --variables 6 --seed 900 \
            --output /tmp/knapsack.json
          fmco solve \
            --input /tmp/knapsack.json \
            --checkpoint /tmp/multitask.safetensors --with-exact
          fmco collect \
            --families set_packing \
            --instances-per-family 2 --min-variables 5 --max-variables 6 \
            --seed 1000 --output /tmp/transfer-train
          fmco collect \
            --families set_packing \
            --instances-per-family 1 --min-variables 5 --max-variables 6 \
            --seed 1100 --output /tmp/transfer-validation
          fmco adapt /tmp/transfer-train --validation /tmp/transfer-validation \
            --tasks set_packing --input-checkpoint /tmp/multitask.safetensors \
            --freeze-encoder --epochs 2 --batch-size 2 --seed 9 \
            --checkpoint /tmp/transfer.safetensors
          fmco benchmark /tmp/transfer-validation \
            --checkpoint /tmp/transfer.safetensors \
            --label few_shot_frozen
