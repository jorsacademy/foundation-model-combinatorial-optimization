name: tests
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          pip install "numpy>=1.24"
      - run: python run_diffusion_tsp.py --self-test
      - run: python -m unittest discover -s tests -v
      - run: |
          python run_diffusion_tsp.py \
            --seed 42 --nodes 6 \
            --train-instances 16 --validation-instances 6 --test-instances 5 \
            --steps 6 --epochs 3 --batch-size 8 --hidden 32 --samples 1
