name: tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run model self-test
        run: python nco_tsp.py --self-test

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Run short REINFORCE training smoke
        run: |
          python nco_tsp.py \
            --train \
            --cpu \
            --graph-size 8 \
            --batch-size 32 \
            --steps-per-epoch 4 \
            --epochs 1 \
            --learning-rate 0.0005 \
            --embedding-dim 32 \
            --heads 4 \
            --encoder-layers 2 \
            --ff-dim 64 \
            --exact-eval-instances 4 \
            --exact-eval-size 8 \
            --checkpoint checkpoints/ci_smoke.pt \
            --seed 42
